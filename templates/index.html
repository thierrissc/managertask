<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager · seu fluxo de tarefas, sem ruído</title>
  <meta name="description" content="Gerenciador de tarefas simples, moderno e responsivo." />

  <!-- Favicon: badge butter yellow + check royal iris -->
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}" />
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='favicon.svg') }}" />

  <!-- Fontes: Sora para títulos, Inter para o corpo do texto -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <div class="page">

    <!-- ===================== MASTHEAD ===================== -->
    <header class="masthead">
      <div class="mast-brand">
        <svg class="brand-mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="8" y="8" width="84" height="84" rx="18" ry="18" fill="#FFF275"/>
          <path d="M28 52 L44 68 L72 36" fill="none" stroke="#3A0CA3" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="mast-text">
          <h1>Task Manager</h1>
          <p>seu fluxo de tarefas, sem ruído</p>
        </div>
      </div>
      <div class="date-nav">
        <button type="button" class="date-trigger" id="dateTrigger" aria-haspopup="true" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M8 3v4M16 3v4M3 10h18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span id="headerDate"></span>
        </button>

        <div class="calendar-popover" id="calendarPopover" hidden>
          <div class="calendar-header">
            <button type="button" class="calendar-nav-btn" id="calPrevMonth" aria-label="Mês anterior">‹</button>
            <span id="calMonthLabel"></span>
            <button type="button" class="calendar-nav-btn" id="calNextMonth" aria-label="Próximo mês">›</button>
          </div>
          <div class="calendar-weekdays">
            <span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span>
          </div>
          <div class="calendar-grid" id="calendarGrid"></div>
          <div class="calendar-footer">
            <button type="button" class="cal-today-btn" id="calToday">Hoje</button>
            <button type="button" class="cal-clear-btn" id="calClear" hidden>Limpar filtro</button>
          </div>
        </div>
      </div>
    </header>

    <!-- ===================== PLACAR (resumo) ===================== -->
    <section class="scoreboard" aria-label="Resumo das tarefas">
      <div class="score">
        <strong id="statTotal">0</strong>
        <span>Total</span>
      </div>
      <span class="score-divider" aria-hidden="true"></span>
      <div class="score score--done">
        <strong id="statConcluidas">0</strong>
        <span>Concluídas</span>
      </div>
      <span class="score-divider" aria-hidden="true"></span>
      <div class="score score--pending">
        <strong id="statPendentes">0</strong>
        <span>Pendentes</span>
      </div>
    </section>

    <!-- ===================== FORMULÁRIO ===================== -->
    <section class="task-form-card" aria-label="Adicionar nova tarefa">
      <form id="taskForm" autocomplete="off">
        <div class="form-row">
          <input
            type="text"
            id="titulo"
            name="titulo"
            placeholder="O que você precisa fazer?"
            maxlength="80"
            required
          />
          <button type="submit" class="btn-add" id="btnAdd">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
            <span>Adicionar</span>
          </button>
        </div>
        <input
          type="text"
          id="descricao"
          name="descricao"
          placeholder="Descrição (opcional)"
          maxlength="200"
        />
      </form>
    </section>

    <!-- ===================== LISTA DE TAREFAS ===================== -->
    <section class="task-list-section">
      <div class="task-list-header">
        <h2>Minhas tarefas</h2>
        <div class="task-filters" role="tablist" aria-label="Filtrar tarefas">
          <button class="filter-btn is-active" data-filter="todas" role="tab" aria-selected="true">Todas</button>
          <button class="filter-btn" data-filter="pendentes" role="tab" aria-selected="false">Pendentes</button>
          <button class="filter-btn" data-filter="concluidas" role="tab" aria-selected="false">Concluídas</button>
        </div>
      </div>

      <div class="date-filter-chip" id="dateFilterChip" hidden>
        <span id="dateFilterLabel"></span>
        <button type="button" id="btnClearDateChip" aria-label="Limpar filtro de data">✕</button>
      </div>

      <ul id="taskList" class="task-list"></ul>

      <div id="emptyState" class="empty-state" hidden>
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 12.5l2.2 2.2L16 9.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="3" y="3" width="18" height="18" rx="6" stroke="currentColor" stroke-width="1.6"/></svg>
        <p id="emptyStateText">Nenhuma tarefa por aqui ainda. Adicione a primeira acima.</p>
      </div>
    </section>

    <footer class="app-footer">
      <p>Task Manager · projeto de estudo e portfólio</p>
    </footer>
  </div>

  <!-- ===================== MODAL DE EDIÇÃO ===================== -->
  <div class="modal-overlay" id="editModalOverlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="editModalTitle">
      <h3 id="editModalTitle">Editar tarefa</h3>
      <form id="editForm">
        <label for="editTitulo">Título</label>
        <input type="text" id="editTitulo" maxlength="80" required />

        <label for="editDescricao">Descrição</label>
        <textarea id="editDescricao" maxlength="200" rows="3"></textarea>

        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="btnCancelEdit">Cancelar</button>
          <button type="submit" class="btn-primary">Salvar alterações</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===================== MODAL DE CONFIRMAÇÃO (EXCLUIR) ===================== -->
  <div class="modal-overlay" id="confirmModalOverlay" hidden>
    <div class="modal modal--confirm" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle">
      <h3 id="confirmTitle">Excluir tarefa?</h3>
      <p>Essa ação não pode ser desfeita.</p>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="btnCancelDelete">Cancelar</button>
        <button type="button" class="btn-danger" id="btnConfirmDelete">Excluir</button>
      </div>
    </div>
  </div>

  <!-- Container de toasts (mensagens de feedback) -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
